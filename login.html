<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | TaskFlow</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="login.html">TaskFlow<span>.</span></a>
    <h1>Welcome back</h1>
    <p class="muted">Log in to manage your projects and tasks.</p>
    <form id="loginForm" class="stack-form">
      <label for="loginUsername">Username</label>
      <input id="loginUsername" name="username" autocomplete="username" placeholder="Your username" required minlength="3">
      <label for="loginPassword">Password</label>
      <div class="input-with-button">
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
        <button type="button" class="show-password" data-toggle="loginPassword">Show</button>
      </div>
      <p id="loginMessage" class="message" role="status" aria-live="polite"></p>
      <button class="btn btn-primary btn-full" type="submit">Log in</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
    <p class="demo-note">School-project demo: accounts are saved in this browser only.</p>
  </main>
</body>
</html>
