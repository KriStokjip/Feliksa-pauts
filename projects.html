<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My projects | TaskFlow</title><link rel="stylesheet" href="style.css">
<script src="app.js" defer></script><script src="projects.js" defer></script>
</head><body class="app-page">
<header class="topbar"><a class="brand" href="dashboard.html">TaskFlow<span>.</span></a><nav class="topnav"><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link active" href="projects.html">My projects</a></nav><div class="user-menu"><span id="userGreeting" class="user-greeting"></span><button id="logoutButton" class="btn btn-quiet btn-small">Log out</button></div></header>
<main class="page-shell"><section class="welcome-row"><div><p class="eyebrow">PLAN TOGETHER</p><h1>My projects</h1><p class="muted">Keep plans, tasks, and teammates in one place.</p></div><button id="showProjectForm" class="btn btn-primary">＋ Create project</button></section>
<section id="projectFormPanel" class="panel form-panel hidden"><div class="panel-heading"><div><h2 id="projectFormTitle">Create a project</h2><p class="muted">Add the basics. You can change them later.</p></div></div>
<form id="projectForm"><input type="hidden" id="projectId"><div class="form-grid">
<div class="field field-wide"><label for="projectName">Project name</label><input id="projectName" maxlength="120" required placeholder="e.g. Website redesign"></div>
<div class="field field-wide"><label for="projectDescription">Description</label><textarea id="projectDescription" rows="3" placeholder="What is this project about?"></textarea></div>
<div class="field"><label for="projectDeadline">Deadline</label><input id="projectDeadline" type="date"></div>
<div class="field"><label for="projectPriority">Priority</label><select id="projectPriority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>
</div><p id="projectFormMessage" class="message" role="status"></p><div class="form-actions"><button type="button" id="cancelProjectForm" class="btn btn-secondary">Cancel</button><button type="submit" class="btn btn-primary">Save project</button></div></form></section>
<section class="filter-row"><div><h2 class="section-title">Your workspace</h2><p id="projectCount" class="muted">Loading projects…</p></div><div class="filters"><input id="projectSearch" type="search" placeholder="Search projects…" aria-label="Search projects"><select id="priorityFilter" aria-label="Filter by priority"><option value="all">All priorities</option><option value="high">High priority</option><option value="medium">Medium priority</option><option value="low">Low priority</option></select></div></section>
<section id="projectGrid" class="project-grid"></section>
</main>
</body>
</html>
