<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | TaskFlow</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="login.html">TaskFlow<span>.</span></a>
    <h1>Create account</h1>
    <p class="muted">Set up your workspace and start organizing.</p>
    <form id="registerForm" class="stack-form">
      <label for="registerUsername">Username</label>
      <input id="registerUsername" name="username" autocomplete="username" placeholder="3–20 letters, numbers or _" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" required>
      <label for="registerEmail">Email</label>
      <input id="registerEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required>
      <label for="registerPassword">Password</label>
      <div class="input-with-button">
        <input id="registerPassword" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
        <button type="button" class="show-password" data-toggle="registerPassword">Show</button>
      </div>
      <div class="password-rules">Use uppercase and lowercase letters, a number, and a special character.</div>
      <div id="strength" class="strength" aria-live="polite"></div>
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter password again" required>
      <p id="registerMessage" class="message" role="status" aria-live="polite"></p>
      <button class="btn btn-primary btn-full" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already registered? <a href="login.html">Log in</a></p>
    <p class="demo-note">Demo only: do not use a real password. This prototype stores credentials in your browser.</p>
  </main>
</body>
</html>
